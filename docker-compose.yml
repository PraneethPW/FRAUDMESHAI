services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/fraudmesh.db}
      FRONTEND_URL: http://localhost:5173
    volumes:
      - fraudmesh_data:/app/data
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_WS_URL: ws://localhost:8000/api/v1/ws
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  fraudmesh_data:
